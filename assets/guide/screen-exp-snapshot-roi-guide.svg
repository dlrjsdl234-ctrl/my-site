<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">경험치 바 영역 지정 예시</title>
  <desc id="desc">시작 종료 비교 측정기에서 경험치 바의 초록색 진행 영역과 회색 빈 영역만 선택하는 예시입니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="0.58" stop-color="#65e85c"/>
      <stop offset="1" stop-color="#c7ff9a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <g opacity="0.65">
    <circle cx="108" cy="70" r="45" fill="#fff"/>
    <circle cx="158" cy="64" r="32" fill="#fff"/>
    <circle cx="970" cy="72" r="58" fill="#fff"/>
    <circle cx="1034" cy="66" r="36" fill="#fff"/>
  </g>

  <rect x="44" y="262" width="1112" height="76" rx="14" fill="#8b6537" filter="url(#shadow)"/>
  <path d="M50 286 C154 248 258 320 366 284 C478 248 592 320 704 284 C820 248 924 322 1030 284 C1086 264 1126 272 1150 288 L1150 338 L50 338 Z" fill="#5c3f20" opacity="0.48"/>

  <g transform="translate(82 178)" filter="url(#shadow)">
    <rect x="0" y="0" width="1036" height="58" rx="12" fill="#111827" opacity="0.76"/>
    <text x="402" y="22" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#fff" stroke="#1f2937" stroke-width="5" paint-order="stroke">56.70%</text>
    <rect x="14" y="34" width="1008" height="14" rx="7" fill="#d1d5db"/>
    <rect x="14" y="34" width="575" height="14" rx="7" fill="url(#barFill)"/>
    <rect x="14" y="34" width="575" height="6" rx="3" fill="#dcfce7" opacity="0.78"/>
  </g>

  <rect x="96" y="212" width="1008" height="14" rx="2" fill="none" stroke="#22c55e" stroke-width="6"/>
  <text x="96" y="204" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#15803d">선택할 영역</text>

  <g filter="url(#shadow)">
    <rect x="174" y="42" width="852" height="86" rx="12" fill="#fff" opacity="0.97"/>
    <text x="212" y="80" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#111827">경험치 바의 색 띠만 드래그해서 감싸세요</text>
    <text x="212" y="110" font-family="Arial, sans-serif" font-size="20" fill="#475569">숫자, 아이콘, 레벨 글자는 포함하지 않아도 됩니다.</text>
  </g>
  <path d="M600 128 L600 212" fill="none" stroke="#22c55e" stroke-width="5" marker-end="url(#arrow)"/>
</svg>
