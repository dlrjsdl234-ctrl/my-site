<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">경험치 화면 측정 영역 지정 예시</title>
  <desc id="desc">빨간 박스는 경험치바의 초록색과 회색 바 영역만 감싸고 숫자, 아이콘, 채팅, 이펙트는 제외합니다.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#74c9ff"/>
      <stop offset="0.55" stop-color="#e7f8ff"/>
      <stop offset="1" stop-color="#97d885"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2fb344"/>
      <stop offset="0.55" stop-color="#71e65d"/>
      <stop offset="1" stop-color="#c5ff99"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#sky)"/>

  <g opacity="0.72">
    <circle cx="110" cy="62" r="44" fill="#fff"/>
    <circle cx="156" cy="55" r="32" fill="#fff"/>
    <circle cx="950" cy="86" r="58" fill="#fff"/>
    <circle cx="1012" cy="78" r="38" fill="#fff"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="40" width="146" height="58" rx="9" fill="#27384d" opacity="0.88"/>
    <text x="100" y="78" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">LV.484</text>
    <rect x="742" y="38" width="104" height="60" rx="12" fill="#334155" opacity="0.9"/>
    <text x="770" y="76" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#dbeafe">스킬</text>
    <rect x="874" y="38" width="104" height="60" rx="12" fill="#334155" opacity="0.9"/>
    <text x="902" y="76" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#dbeafe">장비</text>
  </g>

  <rect x="38" y="270" width="1124" height="78" rx="14" fill="#8b6537" filter="url(#shadow)"/>
  <path d="M42 292 C148 250 248 332 360 291 C468 252 574 332 684 292 C802 250 904 334 1010 292 C1074 268 1115 280 1158 294 L1158 348 L42 348 Z" fill="#5c3f20" opacity="0.55"/>

  <g id="exp-ui" transform="translate(82 214)">
    <rect x="0" y="0" width="1036" height="48" rx="10" fill="#111827" opacity="0.70"/>
    <text x="423" y="18" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#fff" stroke="#1f2937" stroke-width="5" paint-order="stroke">56.70% (1,016,838,523,866 / 1,793,435,540,866)</text>
    <rect x="14" y="26" width="1008" height="14" rx="7" fill="#d1d5db"/>
    <rect x="14" y="26" width="575" height="14" rx="7" fill="url(#barFill)"/>
    <rect x="14" y="26" width="575" height="6" rx="3" fill="#d8ffd0" opacity="0.8"/>
  </g>

  <rect x="96" y="240" width="1008" height="14" rx="2" fill="none" stroke="#ef4444" stroke-width="5"/>

  <g filter="url(#shadow)">
    <rect x="62" y="120" width="382" height="82" rx="10" fill="#0f172a" opacity="0.94"/>
    <text x="86" y="154" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff">빨간 박스</text>
    <text x="86" y="184" font-family="Arial, sans-serif" font-size="21" fill="#e5e7eb">경험치바의 초록/회색 띠만 감싸기</text>

    <rect x="770" y="112" width="372" height="92" rx="10" fill="#0f172a" opacity="0.94"/>
    <text x="794" y="148" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff">영역에서 제외</text>
    <text x="794" y="178" font-family="Arial, sans-serif" font-size="21" fill="#e5e7eb">숫자, 아이콘, 채팅, 이펙트</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="250" y="360" width="700" height="58" rx="12" fill="#fff" opacity="0.97"/>
    <text x="290" y="396" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#111827">영역 지정은 숫자가 아니라 경험치바 기준으로 하세요</text>
  </g>

  <text x="96" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ef4444">측정 영역</text>
</svg>
